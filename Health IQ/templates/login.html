<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Health IQ - Login</title>
    <link rel="stylesheet" href="/static/css/login.css"/>
</head>
<body>
    <div class="auth-wrapper">

        <div class="brand">
            <div class="brand-icon">🛡️</div>
            <span class="brand-name">Health IQ</span>
        </div>

        <!-- hidden checkbox to toggle between forms -->
        <input type="checkbox" id="toggle" hidden />

        <!-- SIGN IN BOX -->
        <div class="signin-box">
            <h2>Welcome Back</h2>
            <p class="subtitle-text">Sign in to your account</p>
            {% if error %}
            <div class="error-msg">⚠ {{ error }}</div>
            {% endif %}
            <form action="/signin" method="POST">
                <div class="input-group">
                    <span class="icon">✉</span>
                    <input type="email" name="email" placeholder="Email address" required />
                </div>
                <div class="input-group">
                    <span class="icon">🔒</span>
                    <input type="password" name="password" placeholder="Password" required />
                </div>
                <button type="submit">Sign In →</button>
            </form>
            <p class="footer-text">Don't have an account?
                <label for="toggle">Sign up</label>
            </p>
        </div>

        <!-- SIGN UP BOX -->
        <div class="signup-box">
            <h2>Create Account</h2>
            <p class="subtitle-text">Join Health IQ for free</p>
            <form action="/signup" method="POST">
                <div class="input-group">
                    <span class="icon">👤</span>
                    <input type="text" name="name" placeholder="Full name" required />
                </div>
                <div class="input-group">
                    <span class="icon">✉</span>
                    <input type="email" name="email" placeholder="Email address" required />
                </div>
                <div class="input-group">
                    <span class="icon">🔒</span>
                    <input type="password" name="password" placeholder="Password" required />
                </div>
                <button type="submit">Create Account →</button>
            </form>
            <p class="footer-text">Already have an account?
                <label for="toggle">Sign in</label>
            </p>
        </div>

    </div>
</body>
</html>
