<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Health IQ - Login</title>
    <link rel="stylesheet" href="/static/css/login.css"/>
</head>
<body>
    <!-- hidden checkbox to toggle forms -->
    <input type="checkbox" id="toggle" hidden />

    <div class="box signin-box">
        <h2>Sign In</h2>
        {% if error %}
        <p style="color:red; text-align:center;">{{ error }}</p>
        {% endif %}
        <form action="/signin" method="POST">
            <input type="email" name="email" placeholder="Email" required />
            <input type="password" name="password" placeholder="Password" required />
            <button type="submit">Sign In</button>
        </form>
        <p>Don't have an account? <label for="toggle">Sign up</label></p>
    </div>

    <div class="box signup-box">
        <h2>Create Account</h2>
        <form action="/signup" method="POST">
            <input type="text" name="name" placeholder="Full name" required />
            <input type="email" name="email" placeholder="Email" required />
            <input type="password" name="password" placeholder="Password" required />
            <button type="submit">Sign Up</button>
        </form>
        <p>Already have an account? <label for="toggle">Sign in</label></p>
    </div>
</body>
</html>
